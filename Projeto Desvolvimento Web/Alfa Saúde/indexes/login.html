<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Alfa Saúde</title>
    <script src="../javasinho/login.js" defer></script>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <div id="container">
        <header>
            <nav>
                <div id="logo">
                    <img src="../img/alfa_saude01.png" alt="logo">
                </div>

                <div id="link">
                    <a href="index.html">Página Inicial</a>
                </div>

                <div id="cadastro">
                    <a href="cadastro.html" class="cadastro">Cadastrar-se</a>
                </div>
            </nav>
        </header>

        <main>
            <div id="login-container">
                <h1>Login</h1>
                <form id="login-formato">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

                    <label for="password">Senha:</label>
                    <input type="password" id="password" name="password" placeholder="Digite sua senha" required>

                    <button id="login-button" type="submit">Entrar</button>
                </form>
            </div>
        </main>
        
        <footer>
            &copy; 2024 Alfa Saúde. Todos os direitos reservados.
        </footer>
    </div>
</body>
</html>
